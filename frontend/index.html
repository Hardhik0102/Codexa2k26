<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Campus Resource Booking</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="container" style="max-width: 440px; margin-top: 50px;">
    <div class="card" style="padding: 28px;">
      <h2 style="text-align: center; margin-bottom: 6px; color: #1e293b;">Campus Resource Booking</h2>
      <p style="text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px;">Book Seminar Halls, Labs & Campus Facilities</p>

      <!-- Portal Selection Tabs -->
      <div class="portal-tabs">
        <div class="portal-tab active" id="tabBooking" onclick="switchPortal('booking')">
          🎓 Student Portal
        </div>
        <div class="portal-tab" id="tabAdmin" onclick="switchPortal('admin')">
          🛡️ Admin Portal
        </div>
      </div>

      <!-- Portal Description Banner -->
      <div id="portalDesc" style="background: #eff6ff; color: #1e40af; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px;">
        📌 <strong>Student Portal:</strong> Enter any student email ID to log in and book halls directly.
      </div>

      <form id="loginForm">
        <label for="email" id="emailLabel">Student Email ID</label>
        <input type="email" id="email" placeholder="student@campus.edu" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <button type="submit" id="submitBtn" style="width: 100%; padding: 11px; margin-top: 8px; font-weight: bold; font-size: 15px;">
          Log In & Book Hall
        </button>
      </form>

      <p id="errorMessage" style="color: #dc2626; margin-top: 12px; font-size: 13px; text-align: center;"></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentPortal = 'booking';

    function switchPortal(portal) {
      currentPortal = portal;
      const tabBooking = document.getElementById('tabBooking');
      const tabAdmin = document.getElementById('tabAdmin');
      const desc = document.getElementById('portalDesc');
      const submitBtn = document.getElementById('submitBtn');
      const emailLabel = document.getElementById('emailLabel');
      const emailInput = document.getElementById('email');

      if (portal === 'admin') {
        tabAdmin.classList.add('active');
        tabBooking.classList.remove('active');
        desc.style.background = '#fef2f2';
        desc.style.color = '#991b1b';
        desc.innerHTML = '🛡️ <strong>Admin Portal:</strong> Log in with administrator credentials to manage venue approvals and settings.';
        emailLabel.textContent = 'Admin Email ID';
        emailInput.placeholder = 'admin@campus.edu';
        submitBtn.textContent = 'Log In to Admin Dashboard';
        submitBtn.style.backgroundColor = '#dc2626';
      } else {
        tabBooking.classList.add('active');
        tabAdmin.classList.remove('active');
        desc.style.background = '#eff6ff';
        desc.style.color = '#1e40af';
        desc.innerHTML = '📌 <strong>Student Portal:</strong> Enter any student email ID to log in and book halls directly.';
        emailLabel.textContent = 'Student Email ID';
        emailInput.placeholder = 'student@campus.edu';
        submitBtn.textContent = 'Log In & Book Hall';
        submitBtn.style.backgroundColor = '#2563eb';
      }
    }
  </script>
</body>
</html>
